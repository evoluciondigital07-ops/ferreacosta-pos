<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS, Proformas e Inventario</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5c6b7c;
      --primary: #0f6cbd;
      --primary-dark: #0a4f8c;
      --success: #198754;
      --warning: #b45309;
      --danger: #c62828;
      --border: #dce3ec;
      --hit: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .mode-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #eef3f8; }
    button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.primary:hover { background: var(--primary-dark); }
    button.success {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    button.danger {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    main {
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 16px 32px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .scan-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }
    #scanInput { flex: 1; min-width: 220px; }
    .status-bar {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .camera-box {
      margin-top: 10px;
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      position: relative;
      display: none;
    }
    .camera-box.active { display: block; }
    .camera-box.scan-hit { border-color: var(--hit); }
    video {
      width: 100%;
      max-height: 280px;
      display: block;
      object-fit: cover;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      text-align: left;
    }
    .totals {
      margin-top: 12px;
      font-size: 15px;
      display: grid;
      gap: 4px;
    }
    .totals .grand {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
    }
    .catalog-list {
      max-height: 300px;
      overflow: auto;
      margin-top: 8px;
    }
    .catalog-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong id="modeTitle">MODO VENTA</strong>
      <span id="vendorBadge" style="margin-left:10px;font-size:13px;color:var(--muted);"></span>
    </div>
    <div class="mode-group">
      <button id="btnModeSale" class="active" onclick="setMode('VENTA')">MODO VENTA</button>
      <button id="btnModeProforma" onclick="setMode('PROFORMA')">MODO PROFORMA</button>
      <button id="btnModeInventory" onclick="setMode('INVENTARIO')">MODO INVENTARIO</button>
      <button onclick="openVendorModal()">Vendedor</button>
    </div>
  </header>

  <main>
    <div>
      <div class="card">
        <div class="scan-row">
          <input
            id="scanInput"
            type="text"
            autocomplete="off"
            placeholder="Escanea código de barras, QR de proforma (P-...) o escribe..."
          />
          <button class="primary" onclick="handleManualAdd()">Agregar</button>
          <button onclick="toggleCameraScanner()">📷 Cámara Barras / QR</button>
          <button onclick="clearCurrentList()">Limpiar</button>
        </div>
        <div id="scannerStatus" class="status-bar">Listo para escanear con lector USB o cámara.</div>
        <div id="cameraBox" class="camera-box">
          <video id="cameraVideo" playsinline muted></video>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong id="listHeading">Detalle de Venta</strong>
          <label style="font-size:13px;">
            Cantidad al agregar:
            <input id="qtyInput" type="number" min="1" step="1" value="1" style="width:76px;" />
          </label>
        </div>
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Producto</th>
              <th>Cant.</th>
              <th>P. Unit.</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>

        <div id="saleSummary" class="totals">
          <div>Subtotal: $<span id="subTotalVal">0.00</span></div>
          <div>IVA (15%): $<span id="ivaVal">0.00</span></div>
          <div class="grand">Total: $<span id="grandTotalVal">0.00</span></div>
        </div>

        <div class="actions">
          <button id="btnPrimaryAction" class="success" onclick="executePrimaryAction()">Generar Venta</button>
          <button id="btnClearStorage" class="danger" onclick="resetDemoData()">Reiniciar Datos</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <strong>Catálogo Rápido</strong>
        <input
          id="catalogFilter"
          type="text"
          placeholder="Filtrar por nombre o SKU..."
          style="width:100%;margin-top:8px;"
          oninput="renderCatalog()"
        />
        <div id="catalogList" class="catalog-list"></div>
      </div>

      <div class="card">
        <strong>Historial Reciente</strong>
        <div id="historyList" class="catalog-list"></div>
      </div>
    </div>
  </main>

  <div id="vendorModal" class="modal-backdrop">
    <div class="modal">
      <h3 style="margin-top:0;">Configurar Vendedor / Operador</h3>
      <input id="vendorNameInput" type="text" placeholder="Nombre del vendedor" style="width:100%;margin-bottom:12px;" />
      <div class="actions" style="justify-content:flex-end;">
        <button onclick="closeVendorModal()">Cancelar</button>
        <button class="primary" onclick="saveVendor()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const IVA_RATE = 0.15;
    const SCAN_COOLDOWN_MS = 650;

    const DEFAULT_CATALOG = [
      { sku: "7861000100115", nombre: "Martillo Carpintero Mango Madera 16oz", precio: 6.50 },
      { sku: "7861000100122", nombre: "Cinta Aislante Negra 18mm x 18m", precio: 1.25 },
      { sku: "7861000100139", nombre: "Candado Bronce 50mm Llaves Latón", precio: 5.80 },
      { sku: "7861000100146", nombre: "Destornillador Estrella Punta Imantada", precio: 2.40 },
      { sku: "7861000100153", nombre: "Silicona Transparente Uso General", precio: 3.15 }
    ];

    let currentMode = "VENTA";
    let vendorName = localStorage.getItem("pos_vendor_name") || "Caja Principal";
    let catalog = JSON.parse(localStorage.getItem("pos_catalog_v1") || "null") || DEFAULT_CATALOG.slice();
    let catalogBySku = {};
    let cartItems = [];
    let proformaItems = [];
    let inventoryItems = [];
    let proformas = JSON.parse(localStorage.getItem("pos_proformas_v1") || "[]");
    let historyRecords = JSON.parse(localStorage.getItem("pos_history_v1") || "[]");

    let sharedAudioCtx = null;
    let scanInputTimer = null;
    let lastAcceptedCode = "";
    let lastAcceptedAt = 0;
    let scanBusy = false;

    let cameraStream = null;
    let cameraLoopId = null;
    let barcodeDetectorInstance = null;
    let lastRawCandidate = "";
    let rawCandidateHits = 0;

    function el(id) {
      return document.getElementById(id);
    }

    function rebuildCatalogIndex() {
      catalogBySku = {};
      catalog.forEach(function (item) {
        if (item && item.sku) {
          catalogBySku[String(item.sku).trim()] = item;
        }
      });
    }

    function focusScanInput() {
      var scanEl = el("scanInput");
      if (!scanEl) return;
      var active = document.activeElement;
      if (
        active &&
        active !== scanEl &&
        (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT") &&
        active.id !== "scanInput"
      ) {
        return;
      }
      setTimeout(function () {
        if (el("vendorModal") && el("vendorModal").classList.contains("open")) return;
        scanEl.focus();
      }, 40);
    }

    function playBeep() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!sharedAudioCtx) {
          sharedAudioCtx = new AudioCtx();
        }
        if (sharedAudioCtx.state === "suspended") {
          sharedAudioCtx.resume();
        }
        var osc = sharedAudioCtx.createOscillator();
        var gain = sharedAudioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1046, sharedAudioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, sharedAudioCtx.currentTime);
        osc.connect(gain);
        gain.connect(sharedAudioCtx.destination);
        osc.start();
        osc.stop(sharedAudioCtx.currentTime + 0.08);
      } catch (err) {
        // Ignorar errores de audio en navegadores restringidos
      }
    }

    function flashScanHit() {
      var box = el("cameraBox");
      if (!box) return;
      box.classList.add("scan-hit");
      setTimeout(function () {
        box.classList.remove("scan-hit");
      }, 260);
    }

    function setScannerStatus(msg) {
      var statusEl = el("scannerStatus");
      if (statusEl) statusEl.textContent = msg;
    }

    function getActiveList() {
      if (currentMode === "PROFORMA") return proformaItems;
      if (currentMode === "INVENTARIO") return inventoryItems;
      return cartItems;
    }

    function setActiveList(nextList) {
      if (currentMode === "PROFORMA") proformaItems = nextList;
      else if (currentMode === "INVENTARIO") inventoryItems = nextList;
      else cartItems = nextList;
    }

    function setMode(mode) {
      currentMode = mode;
      el("btnModeSale").classList.toggle("active", mode === "VENTA");
      el("btnModeProforma").classList.toggle("active", mode === "PROFORMA");
      el("btnModeInventory").classList.toggle("active", mode === "INVENTARIO");

      if (mode === "VENTA") {
        el("modeTitle").textContent = "MODO VENTA";
        el("listHeading").textContent = "Detalle de Venta";
        el("btnPrimaryAction").textContent = "Generar Venta";
        el("saleSummary").style.display = "grid";
      } else if (mode === "PROFORMA") {
        el("modeTitle").textContent = "MODO PROFORMA";
        el("listHeading").textContent = "Detalle de Proforma";
        el("btnPrimaryAction").textContent = "Guardar Proforma (QR P-...)";
        el("saleSummary").style.display = "grid";
      } else {
        el("modeTitle").textContent = "MODO INVENTARIO";
        el("listHeading").textContent = "Conteo Físico de Inventario";
        el("btnPrimaryAction").textContent = "Guardar Conteo";
        el("saleSummary").style.display = "none";
      }
      renderItems();
      focusScanInput();
    }

    function openVendorModal() {
      el("vendorNameInput").value = vendorName;
      el("vendorModal").classList.add("open");
      setTimeout(function () {
        el("vendorNameInput").focus();
      }, 30);
    }

    function closeVendorModal() {
      el("vendorModal").classList.remove("open");
      focusScanInput();
    }

    function saveVendor() {
      var val = (el("vendorNameInput").value || "").trim();
      if (val) {
        vendorName = val;
        localStorage.setItem("pos_vendor_name", vendorName);
      }
      renderVendorBadge();
      closeVendorModal();
    }

    function renderVendorBadge() {
      el("vendorBadge").textContent = "Operador: " + vendorName;
    }

    function findProductByCode(rawCode) {
      var code = String(rawCode || "").trim();
      if (!code) return null;

      if (catalogBySku[code]) {
        return catalogBySku[code];
      }

      var digitsOnly = code.replace(/\D+/g, "");
      if (digitsOnly) {
        if (catalogBySku[digitsOnly]) {
          return catalogBySku[digitsOnly];
        }
        if (digitsOnly.length > 13) {
          var tail13 = digitsOnly.slice(-13);
          if (catalogBySku[tail13]) return catalogBySku[tail13];
        }
        if (digitsOnly.length === 12) {
          var with6 = "6" + digitsOnly;
          var with0 = "0" + digitsOnly;
          if (catalogBySku[with6]) return catalogBySku[with6];
          if (catalogBySku[with0]) return catalogBySku[with0];
        }
        // Evitar búsqueda parcial dentro del campo nombre cuando es código numérico
        return null;
      }

      var lower = code.toLowerCase();
      for (var i = 0; i < catalog.length; i++) {
        if (String(catalog[i].sku || "").toLowerCase() === lower) {
          return catalog[i];
        }
      }
      return null;
    }

    function addProductToActiveList(product, qtyToAdd) {
      if (!product) return;
      var qty = Math.max(1, parseInt(qtyToAdd, 10) || 1);
      var list = getActiveList().slice();
      var existing = list.find(function (row) {
        return row.sku === product.sku;
      });
      if (existing) {
        existing.qty += qty;
      } else {
        list.push({
          sku: product.sku,
          nombre: product.nombre,
          precio: Number(product.precio) || 0,
          qty: qty
        });
      }
      setActiveList(list);
      renderItems();
    }

    function loadProformaByCode(proformaCode) {
      var target = String(proformaCode || "").trim().toUpperCase();
      var found = proformas.find(function (p) {
        return String(p.code || "").toUpperCase() === target;
      });
      if (!found || !Array.isArray(found.items)) {
        setScannerStatus("Proforma no encontrada: " + target);
        return false;
      }
      if (currentMode === "INVENTARIO") {
        setMode("VENTA");
      }
      var cloned = found.items.map(function (item) {
        return {
          sku: item.sku,
          nombre: item.nombre,
          precio: Number(item.precio) || 0,
          qty: Math.max(1, parseInt(item.qty, 10) || 1)
        };
      });
      setActiveList(cloned);
      renderItems();
      playBeep();
      setScannerStatus("Proforma cargada: " + target);
      return true;
    }

    function handleCodeLookup(rawValue) {
      var trimmed = String(rawValue || "").trim();
      if (!trimmed) {
        focusScanInput();
        return;
      }

      if (/^P-/i.test(trimmed)) {
        loadProformaByCode(trimmed);
        el("scanInput").value = "";
        focusScanInput();
        return;
      }

      var normCode = trimmed;
      var digitsOnly = trimmed.replace(/\D+/g, "");
      if (digitsOnly.length > 13) {
        normCode = digitsOnly.slice(-13);
      } else if (digitsOnly.length === 13) {
        normCode = digitsOnly;
      } else if (digitsOnly.length === 12) {
        normCode = digitsOnly;
      }

      var product = findProductByCode(normCode);
      if (!product) {
        setScannerStatus("Código no encontrado: " + normCode);
        el("scanInput").select();
        return;
      }

      var qtyVal = el("qtyInput").value || 1;
      addProductToActiveList(product, qtyVal);
      el("qtyInput").value = "1";
      el("scanInput").value = "";
      playBeep();
      setScannerStatus("Agregado: " + product.nombre + " (" + product.sku + ")");
      focusScanInput();
    }

    function handleManualAdd() {
      handleCodeLookup(el("scanInput").value);
    }

    function clearCurrentList() {
      setActiveList([]);
      renderItems();
      setScannerStatus("Lista limpiada.");
      focusScanInput();
    }

    function persistProformas() {
      localStorage.setItem("pos_proformas_v1", JSON.stringify(proformas));
    }

    function persistHistory() {
      localStorage.setItem("pos_history_v1", JSON.stringify(historyRecords));
    }

    function removeItemAt(index) {
      var list = getActiveList().slice();
      list.splice(index, 1);
      setActiveList(list);
      renderItems();
      focusScanInput();
    }

    function renderItems() {
      var tbody = el("itemsBody");
      var list = getActiveList();
      tbody.innerHTML = "";

      var subTotal = 0;
      list.forEach(function (item, idx) {
        var lineTotal = (Number(item.precio) || 0) * (Number(item.qty) || 0);
        subTotal += lineTotal;
        var tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + escapeHtml(item.sku) + "</td>" +
          "<td>" + escapeHtml(item.nombre) + "</td>" +
          "<td>" + item.qty + "</td>" +
          "<td>$" + Number(item.precio).toFixed(2) + "</td>" +
          "<td>$" + lineTotal.toFixed(2) + "</td>" +
          '<td><button onclick="removeItemAt(' + idx + ')">✕</button></td>';
        tbody.appendChild(tr);
      });

      var iva = subTotal * IVA_RATE;
      var grand = subTotal + iva;
      el("subTotalVal").textContent = subTotal.toFixed(2);
      el("ivaVal").textContent = iva.toFixed(2);
      el("grandTotalVal").textContent = grand.toFixed(2);
    }

    function executePrimaryAction() {
      var list = getActiveList();
      if (!list.length) {
        setScannerStatus("No hay ítems en la lista actual.");
        focusScanInput();
        return;
      }

      var now = new Date().toLocaleString("es-EC");
      if (currentMode === "VENTA") {
        var sub = list.reduce(function (acc, it) {
          return acc + (Number(it.precio) || 0) * (Number(it.qty) || 0);
        }, 0);
        var total = +(sub * (1 + IVA_RATE)).toFixed(2);
        historyRecords.unshift({
          tipo: "VENTA",
          operador: vendorName,
          fecha: now,
          total: total,
          itemsCount: list.length
        });
        persistHistory();
        cartItems = [];
        renderItems();
        renderHistory();
        playBeep();
        setScannerStatus("Venta generada por $" + total.toFixed(2));
      } else if (currentMode === "PROFORMA") {
        var code = "P-" + Date.now().toString().slice(-6);
        proformas.unshift({
          code: code,
          operador: vendorName,
          fecha: now,
          items: list.slice()
        });
        persistProformas();
        historyRecords.unshift({
          tipo: "PROFORMA " + code,
          operador: vendorName,
          fecha: now,
          total: +(list.reduce(function (acc, it) {
            return acc + (Number(it.precio) || 0) * (Number(it.qty) || 0);
          }, 0) * (1 + IVA_RATE)).toFixed(2),
          itemsCount: list.length
        });
        persistHistory();
        proformaItems = [];
        renderItems();
        renderHistory();
        playBeep();
        setScannerStatus("Proforma guardada con código QR: " + code);
      } else {
        historyRecords.unshift({
          tipo: "INVENTARIO",
          operador: vendorName,
          fecha: now,
          total: 0,
          itemsCount: list.reduce(function (acc, it) { return acc + it.qty; }, 0)
        });
        persistHistory();
        inventoryItems = [];
        renderItems();
        renderHistory();
        playBeep();
        setScannerStatus("Conteo de inventario guardado.");
      }
      focusScanInput();
    }

    function renderCatalog() {
      var filter = (el("catalogFilter").value || "").trim().toLowerCase();
      var container = el("catalogList");
      container.innerHTML = "";

      catalog
        .filter(function (item) {
          if (!filter) return true;
          return (
            String(item.nombre || "").toLowerCase().indexOf(filter) !== -1 ||
            String(item.sku || "").toLowerCase().indexOf(filter) !== -1
          );
        })
        .forEach(function (item) {
          var row = document.createElement("div");
          row.className = "catalog-item";
          row.innerHTML =
            "<div><strong>" + escapeHtml(item.nombre) + "</strong><br><span>" +
            escapeHtml(item.sku) + " · $" + Number(item.precio).toFixed(2) + "</span></div>" +
            '<button onclick="quickAddSku(\'' + escapeJs(item.sku) + '\')">+ Añadir</button>';
          container.appendChild(row);
        });
    }

    function quickAddSku(sku) {
      var prod = findProductByCode(sku);
      if (prod) {
        addProductToActiveList(prod, el("qtyInput").value || 1);
        el("qtyInput").value = "1";
        playBeep();
        setScannerStatus("Agregado: " + prod.nombre);
      }
      focusScanInput();
    }

    function renderHistory() {
      var container = el("historyList");
      container.innerHTML = "";
      historyRecords.slice(0, 12).forEach(function (rec) {
        var row = document.createElement("div");
        row.className = "catalog-item";
        row.innerHTML =
          "<div><strong>" + escapeHtml(rec.tipo) + "</strong> · " + rec.itemsCount + " ítem(s)<br>" +
          "<span>" + escapeHtml(rec.fecha) + " · " + escapeHtml(rec.operador) + "</span></div>" +
          "<strong>$" + Number(rec.total || 0).toFixed(2) + "</strong>";
        container.appendChild(row);
      });
    }

    function resetDemoData() {
      localStorage.removeItem("pos_proformas_v1");
      localStorage.removeItem("pos_history_v1");
      proformas = [];
      historyRecords = [];
      cartItems = [];
      proformaItems = [];
      inventoryItems = [];
      renderItems();
      renderHistory();
      setScannerStatus("Datos de historial y proformas reiniciados.");
      focusScanInput();
    }

    function acceptDetectedCode(codeVal, formatHint) {
      var clean = String(codeVal || "").trim();
      if (!clean || scanBusy) return;

      var isQr =
        String(formatHint || "").toLowerCase().indexOf("qr") !== -1 ||
        /^P-/i.test(clean);

      if (!isQr) {
        if (clean === lastRawCandidate) {
          rawCandidateHits += 1;
        } else {
          lastRawCandidate = clean;
          rawCandidateHits = 1;
        }
        if (rawCandidateHits < 2) {
          return;
        }
      }

      var now = Date.now();
      if (clean === lastAcceptedCode && now - lastAcceptedAt < SCAN_COOLDOWN_MS) {
        return;
      }

      scanBusy = true;
      lastAcceptedCode = clean;
      lastAcceptedAt = now;
      lastRawCandidate = "";
      rawCandidateHits = 0;

      flashScanHit();
      handleCodeLookup(clean);

      setTimeout(function () {
        scanBusy = false;
      }, 200);
    }

    async function toggleCameraScanner() {
      if (cameraStream) {
        stopCameraScanner();
        setScannerStatus("Cámara detenida.");
        focusScanInput();
        return;
      }

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setScannerStatus("Este navegador no permite acceso a la cámara.");
          return;
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        var video = el("cameraVideo");
        video.srcObject = cameraStream;
        await video.play();
        el("cameraBox").classList.add("active");
        setScannerStatus("Cámara activa (QR inmediato / Barras con 2 aciertos).");

        if ("BarcodeDetector" in window) {
          barcodeDetectorInstance = new window.BarcodeDetector({
            formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"]
          });
        } else {
          barcodeDetectorInstance = null;
        }

        scheduleCameraTick();
      } catch (err) {
        stopCameraScanner();
        setScannerStatus("No se pudo iniciar la cámara: " + (err && err.message ? err.message : "permiso denegado"));
      }
    }

    function scheduleCameraTick() {
      var delay = barcodeDetectorInstance ? 120 : 400;
      cameraLoopId = setTimeout(async function () {
        if (!cameraStream) return;
        var video = el("cameraVideo");
        if (video && video.readyState === 4 && barcodeDetectorInstance) {
          try {
            var barcodes = await barcodeDetectorInstance.detect(video);
            if (barcodes && barcodes.length > 0) {
              acceptDetectedCode(barcodes[0].rawValue, barcodes[0].format);
            }
          } catch (e) {
            // Continuar bucle de lectura
          }
        }
        scheduleCameraTick();
      }, delay);
    }

    function stopCameraScanner() {
      if (cameraLoopId) {
        clearTimeout(cameraLoopId);
        cameraLoopId = null;
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach(function (track) {
          track.stop();
        });
        cameraStream = null;
      }
      var video = el("cameraVideo");
      if (video) {
        video.srcObject = null;
      }
      el("cameraBox").classList.remove("active", "scan-hit");
      lastRawCandidate = "";
      rawCandidateHits = 0;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return String(str || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }

    el("scanInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(scanInputTimer);
        handleCodeLookup(this.value);
      }
    });

    el("scanInput").addEventListener("input", function () {
      var currentVal = this.value;
      clearTimeout(scanInputTimer);

      var trimmed = currentVal.trim();
      var digitsOnly = trimmed.replace(/\D+/g, "");
      if (/^P-/i.test(trimmed) && trimmed.length >= 8) {
        handleCodeLookup(trimmed);
        return;
      }
      if (digitsOnly.length >= 13) {
        handleCodeLookup(trimmed);
        return;
      }

      scanInputTimer = setTimeout(function () {
        if (el("scanInput").value.trim().length > 0) {
          handleCodeLookup(el("scanInput").value);
        }
      }, 100);
    });

    rebuildCatalogIndex();
    renderVendorBadge();
    renderCatalog();
    renderItems();
    renderHistory();
    focusScanInput();
  </script>
</body>
</html>
