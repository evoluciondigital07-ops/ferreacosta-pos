<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERREACOSTA POS</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --ink: #16202a;
      --muted: #5c6b7a;
      --line: #dce3ea;
      --accent: #0f5c8d;
      --accent-dark: #0a4266;
      --accent-soft: #e6f2fa;
      --ok: #157347;
      --ok-soft: #e8f6ef;
      --warn: #9a5b00;
      --warn-soft: #fff5e5;
      --err: #b42318;
      --err-soft: #fef3f2;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.35;
    }

    header.topbar {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
      color: var(--accent-dark);
    }

    .badge {
      background: var(--accent-soft);
      color: var(--accent-dark);
      border: 1px solid #bddcf0;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge.prof {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: #f3d299;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, input, button {
      font-family: inherit;
      font-size: 0.9rem;
    }

    select, input[type="text"], input[type="number"] {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 10px;
      min-height: 36px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 11px;
      min-height: 36px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:active {
      transform: scale(0.99);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-dark);
    }

    button.success {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    button.danger {
      background: var(--err-soft);
      border-color: #f5c2be;
      color: var(--err);
    }

    button.warn {
      background: var(--warn-soft);
      border-color: #f3d299;
      color: var(--warn);
    }

    .mode-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #eef2f6;
    }

    .mode-switch button {
      border: 0;
      border-radius: 0;
      background: transparent;
      min-height: 34px;
      padding: 6px 12px;
    }

    .mode-switch button.active {
      background: var(--accent);
      color: #fff;
    }

    main.layout {
      max-width: 1280px;
      margin: 12px auto;
      padding: 0 12px 36px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 12px;
    }

    @media (max-width: 900px) {
      main.layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-row input {
      flex: 1;
    }

    .catalog-list {
      max-height: 460px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cat-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fcfdff;
    }

    .cat-meta {
      min-width: 0;
    }

    .cat-name {
      font-weight: 700;
      font-size: 0.9rem;
      word-break: break-word;
    }

    .cat-sub {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .cat-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cat-price {
      font-weight: 800;
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .ticket-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    /* Fila compacta del ticket, especialmente en móviles */
    .t-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 0.84rem;
    }

    .t-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .t-sub {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .t-qty-box {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .t-qty-box input {
      width: 52px;
      min-height: 30px;
      padding: 3px 5px;
      text-align: center;
      font-size: 0.82rem;
    }

    .t-qty-box button {
      min-height: 30px;
      width: 28px;
      padding: 0;
      font-size: 0.88rem;
    }

    .t-line-total {
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
      min-width: 64px;
    }

    .t-del {
      min-height: 30px;
      width: 28px;
      padding: 0;
    }

    @media (max-width: 600px) {
      .t-row {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 4px 6px;
        padding: 5px 6px;
      }
      .t-line-total {
        grid-column: 2;
        min-width: 56px;
        font-size: 0.8rem;
      }
      .t-qty-box {
        grid-column: 1;
      }
      .t-del {
        grid-column: 3;
      }
    }

    .totals-box {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.88rem;
    }

    .tot-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tot-line.grand {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--accent-dark);
      padding-top: 4px;
      border-top: 1px dashed var(--line);
    }

    .pay-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .pay-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.8rem;
    }

    .pay-field label {
      color: var(--muted);
      font-weight: 600;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .actions-row button {
      flex: 1;
      min-width: 130px;
    }

    .status-banner {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      display: none;
    }

    .status-banner.ok {
      display: block;
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid #b7e4cc;
    }

    .status-banner.warn {
      display: block;
      background: var(--warn-soft);
      color: var(--warn);
      border: 1px solid #f5d393;
    }

    .status-banner.err {
      display: block;
      background: var(--err-soft);
      color: var(--err);
      border: 1px solid #f6c4c0;
    }

    .qr-panel {
      margin-top: 12px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      display: none;
      background: #fafcff;
    }

    .qr-panel.show {
      display: block;
    }

    #qrCodeBox {
      display: inline-flex;
      justify-content: center;
      margin: 8px auto;
      padding: 8px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    #qrReaderBox {
      margin-top: 8px;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      border: 1px solid var(--line);
    }

    #qrReaderBox.show {
      display: block;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #16202a;
      color: #fff;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
      max-width: 92vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">FERREACOSTA POS</span>
      <span id="docNumberBadge" class="badge">Comprobante: V-000001</span>
      <span id="redeemTag" class="badge prof" style="display:none;"></span>
    </div>

    <div class="top-controls">
      <div class="mode-switch" role="group" aria-label="Modo de comprobante">
        <button id="btnModeVenta" class="active" type="button" onclick="setMode('VENTA')">Venta</button>
        <button id="btnModeProforma" type="button" onclick="setMode('PROFORMA')">Proforma</button>
      </div>

      <select id="vendorSelect" aria-label="Vendedor">
        <option value="Vendedor 1">Vendedor 1</option>
      </select>

      <input id="cajaInput" type="text" value="Caja Principal" style="width:130px;" aria-label="Caja" />

      <button id="btnSync" type="button" onclick="syncCatalog(false)">Sincronizar</button>
      <button id="btnScanToggle" class="warn" type="button" onclick="toggleScanner()">Escanear QR</button>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="card-title">
        <span>Catálogo de productos</span>
        <span id="catalogCount" class="cat-sub">0 ítems</span>
      </div>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Buscar por nombre o SKU..." oninput="renderCatalog()" />
        <input id="manualProfIdInput" type="text" placeholder="P-000001" style="width:118px;" aria-label="Código proforma" />
        <button type="button" onclick="loadProformaByCode(document.getElementById('manualProfIdInput').value)">Cargar P-</button>
      </div>

      <div id="qrReaderBox"></div>

      <div id="catalogList" class="catalog-list"></div>
    </section>

    <section class="card">
      <div class="card-title">
        <span id="ticketTitle">Ticket de venta</span>
        <button class="danger" type="button" onclick="clearTicket(true)" style="min-height:30px;padding:4px 9px;font-size:0.78rem;">Limpiar</button>
      </div>

      <div id="ticketItems" class="ticket-items"></div>

      <div class="totals-box">
        <div class="tot-line">
          <span>Subtotal</span>
          <strong id="subtotalVal">$0.00</strong>
        </div>
        <div class="tot-line">
          <span>IVA (15%)</span>
          <strong id="ivaVal">$0.00</strong>
        </div>
        <div class="tot-line grand">
          <span>Total a pagar</span>
          <span id="totalVal">$0.00</span>
        </div>
      </div>

      <div class="pay-grid">
        <div class="pay-field">
          <label for="payMethod">Método de pago</label>
          <select id="payMethod" onchange="updateChange()">
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Mixto">Mixto</option>
          </select>
        </div>

        <div class="pay-field">
          <label for="billDenom">Billete / Moneda</label>
          <select id="billDenom">
            <option value="No especificado">No especificado</option>
            <option value="$1">$1</option>
            <option value="$5">$5</option>
            <option value="$10">$10</option>
            <option value="$20">$20</option>
            <option value="$50">$50</option>
            <option value="$100">$100</option>
          </select>
        </div>

        <div class="pay-field">
          <label for="cashReceived">Efectivo recibido ($)</label>
          <input id="cashReceived" type="number" step="0.01" min="0" placeholder="0.00" oninput="updateChange()" />
        </div>

        <div class="pay-field">
          <label>Cambio / Vuelto</label>
          <input id="changeDisplay" type="text" value="$0.00" readonly />
        </div>
      </div>

      <div class="actions-row">
        <button id="btnSubmitDoc" class="success" type="button" onclick="submitDocument()">Generar Venta</button>
      </div>

      <div id="statusBanner" class="status-banner"></div>

      <div id="qrPanel" class="qr-panel">
        <div style="font-weight:700;" id="qrDocLabel">Proforma P-000001</div>
        <div id="qrCodeBox"></div>
        <div class="cat-sub">Escanea este código QR desde otro celular o laptop para cargar y canjear una sola vez.</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script>
    // Reemplaza esta URL con la de tu Web App de Google Apps Script publicada
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcyJRAKSFEbCJ57gjTAoa6YX7fCyai3ltfcqe5PyIEinQwjiC_z9sXDmB9K-MUg1hd/exec";
    const IVA_RATE = 0.15;

    const STORAGE_KEYS = {
      CATALOG: "fa_catalog_cache",
      VENDORS: "fa_vendors_cache",
      SEQ_VENTA: "fa_seq_venta",
      SEQ_PROFORMA: "fa_seq_proforma",
      PROFORMAS: "fa_proformas_local",
      REDEEMED: "fa_proformas_redeemed_local"
    };

    const DEFAULT_CATALOG = [
      { sku: "1001", nombre: "Clavo acero 2 pulg (lb)", precio: 1.50, unidad: "lb", stock: null },
      { sku: "1002", nombre: "Cinta aislante negra", precio: 1.25, unidad: "und", stock: null },
      { sku: "1003", nombre: "Disco corte metal 4.5 pulg", precio: 1.80, unidad: "und", stock: null }
    ];

    let state = {
      mode: "VENTA",
      catalog: [],
      vendors: ["Vendedor 1"],
      ticket: [],
      loadedProformaId: "",
      isSyncing: false,
      isSubmitting: false
    };

    let qrScannerInstance = null;
    let isScannerRunning = false;
    let lastScannedCode = "";
    let lastScanTime = 0;

    function formatMoney(num) {
      const n = Number(num);
      const safe = Number.isFinite(n) ? n : 0;
      return "$" + safe.toFixed(2);
    }

    function parseNum(val) {
      if (typeof val === "number") return Number.isFinite(val) ? val : 0;
      const cleaned = String(val ?? "").replace(/[^0-9,.-]/g, "").replace(",", ".");
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function setBanner(type, text) {
      const box = document.getElementById("statusBanner");
      box.className = "status-banner";
      if (!text) {
        box.textContent = "";
        return;
      }
      box.classList.add(type);
      box.textContent = text;
    }

    function playBeep(ok) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = ok ? "sine" : "sawtooth";
        osc.frequency.value = ok ? 880 : 240;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, ok ? 120 : 260);
      } catch (_) {}
    }

    function getSeq(key) {
      return Math.max(0, parseInt(localStorage.getItem(key) || "0", 10) || 0);
    }

    function setSeq(key, val) {
      const safe = Math.max(0, parseInt(val, 10) || 0);
      localStorage.setItem(key, String(safe));
    }

    function peekNextDocNumber(mode) {
      const isProf = String(mode || state.mode).toUpperCase() === "PROFORMA";
      const prefix = isProf ? "P-" : "V-";
      const key = isProf ? STORAGE_KEYS.SEQ_PROFORMA : STORAGE_KEYS.SEQ_VENTA;
      const nextNum = getSeq(key) + 1;
      return prefix + String(nextNum).padStart(6, "0");
    }

    function consumeNextDocNumber(mode) {
      const isProf = String(mode || state.mode).toUpperCase() === "PROFORMA";
      const prefix = isProf ? "P-" : "V-";
      const key = isProf ? STORAGE_KEYS.SEQ_PROFORMA : STORAGE_KEYS.SEQ_VENTA;
      const nextNum = getSeq(key) + 1;
      setSeq(key, nextNum);
      updateDocNumberBadge();
      return prefix + String(nextNum).padStart(6, "0");
    }

    function syncSeqFromAssignedId(assignedId, showReassignedMsg) {
      const clean = String(assignedId || "").trim().toUpperCase();
      const match = clean.match(/^([VP])-(\d+)$/);
      if (!match) return;

      const prefix = match[1];
      const num = parseInt(match[2], 10);
      if (!Number.isFinite(num) || num <= 0) return;

      const key = prefix === "P" ? STORAGE_KEYS.SEQ_PROFORMA : STORAGE_KEYS.SEQ_VENTA;
      const current = getSeq(key);
      if (num > current) {
        setSeq(key, num);
        updateDocNumberBadge();
      }
      if (showReassignedMsg) {
        showToast("Número ajustado a " + clean + " para evitar duplicados");
      }
    }

    function updateDocNumberBadge() {
      const badge = document.getElementById("docNumberBadge");
      const nextCode = peekNextDocNumber(state.mode);
      const label = state.mode === "PROFORMA" ? "Proforma" : "Comprobante";
      badge.textContent = ${label}: ${nextCode};
      badge.className = state.mode === "PROFORMA" ? "badge prof" : "badge";

      const tag = document.getElementById("redeemTag");
      if (state.mode === "VENTA" && state.loadedProformaId) {
        tag.style.display = "inline-block";
        tag.textContent = "Canjeando " + state.loadedProformaId;
      } else {
        tag.style.display = "none";
        tag.textContent = "";
      }
    }

    function setMode(newMode) {
      state.mode = newMode === "PROFORMA" ? "PROFORMA" : "VENTA";
      document.getElementById("btnModeVenta").classList.toggle("active", state.mode === "VENTA");
      document.getElementById("btnModeProforma").classList.toggle("active", state.mode === "PROFORMA");
      document.getElementById("ticketTitle").textContent =
        state.mode === "PROFORMA" ? "Ticket de proforma" : "Ticket de venta";
      document.getElementById("btnSubmitDoc").textContent =
        state.mode === "PROFORMA" ? "Generar Proforma" : "Generar Venta";
      updateDocNumberBadge();
      updateChange();
    }

    function loadLocalCaches() {
      try {
        const catRaw = localStorage.getItem(STORAGE_KEYS.CATALOG);
        if (catRaw) {
          const parsed = JSON.parse(catRaw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.catalog = parsed;
          }
        }
      } catch (_) {}

      if (!state.catalog.length) {
        state.catalog = DEFAULT_CATALOG.slice();
      }

      try {
        const venRaw = localStorage.getItem(STORAGE_KEYS.VENDORS);
        if (venRaw) {
          const parsedVen = JSON.parse(venRaw);
          if (Array.isArray(parsedVen) && parsedVen.length > 0) {
            state.vendors = parsedVen;
          }
        }
      } catch (_) {}

      renderVendors();
      renderCatalog();
      updateDocNumberBadge();
    }

    function renderVendors() {
      const sel = document.getElementById("vendorSelect");
      const currentVal = sel.value;
      const list = state.vendors.length ? state.vendors : ["Vendedor 1"];
      sel.innerHTML = "";
      list.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
      if (currentVal && list.includes(currentVal)) {
        sel.value = currentVal;
      }
    }

    function renderCatalog() {
      const q = String(document.getElementById("searchInput").value || "").trim().toLowerCase();
      const listEl = document.getElementById("catalogList");
      const filtered = state.catalog.filter((it) => {
        if (!q) return true;
        return (
          String(it.nombre || "").toLowerCase().includes(q) ||
          String(it.sku || "").toLowerCase().includes(q)
        );
      });

      document.getElementById("catalogCount").textContent = ${filtered.length} ítems;
      listEl.innerHTML = "";

      if (!filtered.length) {
        listEl.innerHTML = <div class="cat-sub" style="padding:12px;text-align:center;">No se encontraron productos.</div>;
        return;
      }

      filtered.forEach((item) => {
        const row = document.createElement("div");
        row.className = "cat-item";

        const stockTxt = item.stock !== null && item.stock !== undefined
          ? ` · Stock: ${item.stock}`
          : "";

        row.innerHTML = `
          <div class="cat-meta">
            <div class="cat-name">${escapeHtml(item.nombre)}</div>
            <div class="cat-sub">SKU: ${escapeHtml(item.sku)} · ${escapeHtml(item.unidad || "und")}${escapeHtml(stockTxt)}</div>
          </div>
          <div class="cat-right">
            <span class="cat-price">${formatMoney(item.precio)}</span>
            <button class="primary" type="button" onclick="addToTicket('${escapeAttr(item.sku)}')">+ Agregar</button>
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    function addToTicket(sku, qtyToAdd = 1, customPrice = null) {
      const prod = state.catalog.find((c) => String(c.sku).toLowerCase() === String(sku).toLowerCase());
      const precio = customPrice !== null ? parseNum(customPrice) : (prod ? parseNum(prod.precio) : 0);
      const nombre = prod ? prod.nombre : sku;
      const unidad = prod ? (prod.unidad || "und") : "und";
      const addQty = Math.max(0.01, parseNum(qtyToAdd) || 1);

      const existing = state.ticket.find((t) => String(t.sku).toLowerCase() === String(sku).toLowerCase());
      if (existing) {
        existing.cant = Number((existing.cant + addQty).toFixed(2));
        if (customPrice !== null) existing.precio = precio;
      } else {
        state.ticket.push({
          sku: String(sku),
          nombre,
          unidad,
          cant: Number(addQty.toFixed(2)),
          precio: Number(precio.toFixed(2))
        });
      }
      renderTicket();
    }

    function updateTicketQty(index, newQty) {
      if (index < 0 || index >= state.ticket.length) return;
      const q = parseNum(newQty);
      if (q <= 0) {
        state.ticket.splice(index, 1);
      } else {
        state.ticket[index].cant = Number(q.toFixed(2));
      }
      renderTicket();
    }

    function stepTicketQty(index, delta) {
      if (index < 0 || index >= state.ticket.length) return;
      const next = Number((state.ticket[index].cant + delta).toFixed(2));
      if (next <= 0) {
        state.ticket.splice(index, 1);
      } else {
        state.ticket[index].cant = next;
      }
      renderTicket();
    }

    function removeTicketItem(index) {
      if (index < 0 || index >= state.ticket.length) return;
      state.ticket.splice(index, 1);
      renderTicket();
    }

    function renderTicket() {
      const container = document.getElementById("ticketItems");
      container.innerHTML = "";

      if (!state.ticket.length) {
        container.innerHTML = <div class="cat-sub" style="padding:14px;text-align:center;">Agrega productos del catálogo o escanea una proforma QR.</div>;
        updateTotals();
        return;
      }

      state.ticket.forEach((it, idx) => {
        const lineSub = Number((it.cant * it.precio).toFixed(2));
        const row = document.createElement("div");
        row.className = "t-row";
        row.innerHTML = `
          <div>
            <div class="t-name" title="${escapeAttr(it.nombre)}">${escapeHtml(it.nombre)}</div>
            <div class="t-sub">${escapeHtml(it.sku)} · ${formatMoney(it.precio)} / ${escapeHtml(it.unidad)}</div>
          </div>
          <div class="t-qty-box">
            <button type="button" onclick="stepTicketQty(${idx}, -1)">-</button>
            <input type="number" step="0.01" min="0" value="${it.cant}" onchange="updateTicketQty(${idx}, this.value)" />
            <button type="button" onclick="stepTicketQty(${idx}, 1)">+</button>
          </div>
          <div class="t-line-total">${formatMoney(lineSub)}</div>
          <button class="t-del danger" type="button" onclick="removeTicketItem(${idx})" title="Quitar">×</button>
        `;
        container.appendChild(row);
      });

      updateTotals();
    }

    function computeTotals() {
      const total = state.ticket.reduce((acc, it) => acc + Number((it.cant * it.precio).toFixed(2)), 0);
      const subtotal = Number((total / (1 + IVA_RATE)).toFixed(2));
      const iva = Number((total - subtotal).toFixed(2));
      return {
        subtotal,
        iva,
        total: Number(total.toFixed(2))
      };
    }

    function updateTotals() {
      const t = computeTotals();
      document.getElementById("subtotalVal").textContent = formatMoney(t.subtotal);
      document.getElementById("ivaVal").textContent = formatMoney(t.iva);
      document.getElementById("totalVal").textContent = formatMoney(t.total);
      updateChange();
    }

    function updateChange() {
      const t = computeTotals();
      const method = document.getElementById("payMethod").value;
      const rec = parseNum(document.getElementById("cashReceived").value);
      const changeEl = document.getElementById("changeDisplay");

      if (state.mode === "PROFORMA" || method !== "Efectivo") {
        changeEl.value = formatMoney(0);
        return;
      }

      const diff = rec > 0 ? Math.max(0, Number((rec - t.total).toFixed(2))) : 0;
      changeEl.value = formatMoney(diff);
    }

    function clearTicket(resetProformaRef = true) {
      state.ticket = [];
      if (resetProformaRef) {
        state.loadedProformaId = "";
      }
      document.getElementById("cashReceived").value = "";
      document.getElementById("changeDisplay").value = formatMoney(0);
      renderTicket();
      updateDocNumberBadge();
    }

    function saveLocalProforma(profObj) {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.PROFORMAS);
        const map = raw ? JSON.parse(raw) : {};
        map[String(profObj.idProforma).toUpperCase()] = profObj;
        localStorage.setItem(STORAGE_KEYS.PROFORMAS, JSON.stringify(map));
      } catch (_) {}
    }

    function getLocalRedeemedMap() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.REDEEMED);
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return {};
      }
    }

    function markLocalProformaRedeemed(profId) {
      const clean = String(profId || "").trim().toUpperCase();
      if (!clean) return;
      const map = getLocalRedeemedMap();
      map[clean] = new Date().toISOString();
      localStorage.setItem(STORAGE_KEYS.REDEEMED, JSON.stringify(map));

      try {
        const raw = localStorage.getItem(STORAGE_KEYS.PROFORMAS);
        const pMap = raw ? JSON.parse(raw) : {};
        if (pMap[clean]) {
          pMap[clean].estado = "Canjeada";
          pMap[clean].canjeada = true;
          localStorage.setItem(STORAGE_KEYS.PROFORMAS, JSON.stringify(pMap));
        }
      } catch (_) {}
    }

    function showProformaQr(profId, totalVal) {
      const panel = document.getElementById("qrPanel");
      const box = document.getElementById("qrCodeBox");
      const lbl = document.getElementById("qrDocLabel");

      lbl.textContent = Proforma ${profId} · Total ${formatMoney(totalVal)};
      box.innerHTML = "";

      if (typeof QRCode !== "undefined") {
        new QRCode(box, {
          text: profId,
          width: 164,
          height: 164,
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        box.textContent = profId;
      }
      panel.classList.add("show");
    }

    async function syncCatalog(silent = false) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("REEMPLAZA_CON_TU_ID")) {
        if (!silent) showToast("Configura APPS_SCRIPT_URL primero");
        return;
      }
      if (state.isSyncing) return;
      state.isSyncing = true;

      try {
        const resp = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now(), { cache: "no-store" });
        const data = await resp.json();
        if (!data || !data.ok) {
          if (!silent) showToast("No se pudo sincronizar con Sheets");
          return;
        }

        if (Array.isArray(data.items) && data.items.length > 0) {
          state.catalog = data.items;
          localStorage.setItem(STORAGE_KEYS.CATALOG, JSON.stringify(data.items));
          renderCatalog();
        }

        if (Array.isArray(data.vendors) && data.vendors.length > 0) {
          state.vendors = data.vendors;
          localStorage.setItem(STORAGE_KEYS.VENDORS, JSON.stringify(data.vendors));
          renderVendors();
        }

        const serverVentaSeq = parseInt(data.last_venta_seq, 10) || 0;
        const localVentaSeq = getSeq(STORAGE_KEYS.SEQ_VENTA);
        setSeq(STORAGE_KEYS.SEQ_VENTA, Math.max(localVentaSeq, serverVentaSeq));

        const serverProfSeq = parseInt(data.last_proforma_seq, 10) || 0;
        const localProfSeq = getSeq(STORAGE_KEYS.SEQ_PROFORMA);
        setSeq(STORAGE_KEYS.SEQ_PROFORMA, Math.max(localProfSeq, serverProfSeq));

        updateDocNumberBadge();
        if (!silent) {
          showToast("Catálogo y correlativos sincronizados");
        }
      } catch (err) {
        if (!silent) {
          showToast("Error de red al sincronizar");
        }
      } finally {
        state.isSyncing = false;
      }
    }

    async function loadProformaByCode(rawCode) {
      const cleanCode = String(rawCode || "").trim().toUpperCase();
      if (!cleanCode) {
        showToast("Ingresa o escanea un código P-...");
        return;
      }

      const redeemedLocal = getLocalRedeemedMap();
      if (redeemedLocal[cleanCode]) {
        playBeep(false);
        setBanner("err", La proforma ${cleanCode} ya fue canjeada anteriormente.);
        showToast(Proforma ${cleanCode} ya canjeada);
        return;
      }

      let prof = null;
      if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("REEMPLAZA_CON_TU_ID")) {
        try {
          const url = ${APPS_SCRIPT_URL}?action=get_proforma&id=${encodeURIComponent(cleanCode)}&t=${Date.now()};
          const resp = await fetch(url, { cache: "no-store" });
          const resJson = await resp.json();
          if (resJson && resJson.ok && resJson.proforma) {
            prof = resJson.proforma;
          }
        } catch (err) {
          setBanner("warn", "No se pudo consultar en línea; revisando respaldo local...");
        }
      }

      if (!prof) {
        try {
          const map = JSON.parse(localStorage.getItem(STORAGE_KEYS.PROFORMAS) || "{}");
          if (map[cleanCode]) prof = map[cleanCode];
        } catch (_) {}
      }

      if (!prof) {
        playBeep(false);
        setBanner("err", No se encontró la proforma ${cleanCode}.);
        showToast(Proforma ${cleanCode} no encontrada);
        return;
      }

      const isRedeemed =
        prof.canjeada === true ||
        String(prof.estado || "").toLowerCase() === "canjeada" ||
        String(prof.estado || "").toLowerCase() === "vendida";

      if (isRedeemed) {
        markLocalProformaRedeemed(cleanCode);
        playBeep(false);
        setBanner("err", La proforma ${cleanCode} ya fue canjeada y no puede usarse de nuevo.);
        showToast(Proforma ${cleanCode} ya fue canjeada);
        return;
      }

      const items = Array.isArray(prof.items) ? prof.items : [];
      if (!items.length) {
        playBeep(false);
        setBanner("warn", La proforma ${cleanCode} no tiene ítems cargados.);
        return;
      }

      setMode("VENTA");
      state.ticket = items.map((it) => {
        const cant = Math.max(0.01, parseNum(it.cant));
        const precio = parseNum(it.precio);
        return {
          sku: String(it.sku || "ITEM"),
          nombre: String(it.nombre || it.sku || "Producto"),
          unidad: String(it.unidad || "und"),
          cant: Number(cant.toFixed(2)),
          precio: Number(precio.toFixed(2))
        };
      });
      state.loadedProformaId = cleanCode;
      renderTicket();
      updateDocNumberBadge();
      playBeep(true);
      setBanner("ok", Proforma ${cleanCode} cargada en el ticket (${items.length} ítems). Lista para cobrar.);
      showToast(Proforma ${cleanCode} cargada);
    }

    async function toggleScanner() {
      const box = document.getElementById("qrReaderBox");
      const btn = document.getElementById("btnScanToggle");

      if (isScannerRunning && qrScannerInstance) {
        try {
          await qrScannerInstance.stop();
          await qrScannerInstance.clear();
        } catch (_) {}
        isScannerRunning = false;
        box.classList.remove("show");
        btn.textContent = "Escanear QR";
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        showToast("Lector QR no disponible en este navegador");
        return;
      }

      box.classList.add("show");
      btn.textContent = "Detener QR";
      qrScannerInstance = new Html5Qrcode("qrReaderBox");

      try {
        await qrScannerInstance.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          async (decodedText) => {
            const nowMs = Date.now();
            const code = String(decodedText || "").trim().toUpperCase();
            if (!code) return;
            if (code === lastScannedCode && nowMs - lastScanTime < 2500) return;
            lastScannedCode = code;
            lastScanTime = nowMs;

            document.getElementById("manualProfIdInput").value = code;
            if (qrScannerInstance && isScannerRunning) {
              try {
                await qrScannerInstance.stop();
                await qrScannerInstance.clear();
              } catch (_) {}
              isScannerRunning = false;
              box.classList.remove("show");
              btn.textContent = "Escanear QR";
            }
            await loadProformaByCode(code);
          },
          () => {}
        );
        isScannerRunning = true;
      } catch (err) {
        box.classList.remove("show");
        btn.textContent = "Escanear QR";
        showToast("No se pudo activar la cámara");
      }
    }

    async function submitDocument() {
      if (state.isSubmitting) return;
      if (!state.ticket.length) {
        showToast("Agrega al menos un producto al ticket");
        return;
      }

      const isProforma = state.mode === "PROFORMA";
      const redeemedId = !isProforma ? state.loadedProformaId : "";

      if (redeemedId && getLocalRedeemedMap()[redeemedId]) {
        playBeep(false);
        setBanner("err", La proforma ${redeemedId} ya fue canjeada.);
        return;
      }

      const t = computeTotals();
      const method = document.getElementById("payMethod").value;
      const billDenom = document.getElementById("billDenom").value;
      const receivedRaw = parseNum(document.getElementById("cashReceived").value);
      const received = isProforma ? 0 : (method === "Efectivo" ? (receivedRaw > 0 ? receivedRaw : t.total) : t.total);
      const change = isProforma || method !== "Efectivo" ? 0 : Math.max(0, Number((received - t.total).toFixed(2)));

      if (!isProforma && method === "Efectivo" && receivedRaw > 0 && receivedRaw < t.total) {
        setBanner("err", El efectivo recibido (${formatMoney(receivedRaw)}) es menor al total (${formatMoney(t.total)}).);
        return;
      }

      const docId = consumeNextDocNumber(state.mode);
      const nowIso = new Date().toISOString();
      const vendedor = document.getElementById("vendorSelect").value || "Vendedor 1";
      const caja = String(document.getElementById("cajaInput").value || "Caja Principal").trim() || "Caja Principal";

      const itemsPayload = state.ticket.map((it) => ({
        sku: it.sku,
        nombre: it.nombre,
        unidad: it.unidad,
        cant: it.cant,
        precio: it.precio,
        subtotal: Number((it.cant * it.precio).toFixed(2))
      }));

      const payload = {
        fecha_hora: nowIso,
        id_venta: docId,
        caja,
        vendedor,
        modo: isProforma ? "PROFORMA" : "VENTA",
        estado: isProforma ? "Proforma" : "Vendida",
        metodo_pago: isProforma ? "Proforma" : method,
        billete_moneda: isProforma ? "No especificado" : billDenom,
        subtotal: t.subtotal,
        iva: t.iva,
        total: t.total,
        efectivo_recibido: received,
        cambio: change,
        id_proforma_canjeada: redeemedId || "",
        items: itemsPayload
      };

      if (isProforma) {
        saveLocalProforma({
          idProforma: docId,
          fechaHora: nowIso,
          vendedor,
          caja,
          total: t.total,
          estado: "Activa",
          canjeada: false,
          items: itemsPayload
        });
      } else if (redeemedId) {
        markLocalProformaRedeemed(redeemedId);
      }

      state.isSubmitting = true;
      const btnSubmit = document.getElementById("btnSubmitDoc");
      btnSubmit.disabled = true;

      let finalDocId = docId;

      try {
        if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("REEMPLAZA_CON_TU_ID")) {
          const resp = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const resJson = await resp.json();

          if (resJson && resJson.assigned_id) {
            finalDocId = String(resJson.assigned_id).trim().toUpperCase();
            syncSeqFromAssignedId(finalDocId, !!resJson.reassigned);
            if (isProforma && finalDocId !== docId) {
              saveLocalProforma({
                idProforma: finalDocId,
                fechaHora: nowIso,
                vendedor,
                caja,
                total: t.total,
                estado: "Activa",
                canjeada: false,
                items: itemsPayload
              });
            }
          }

          if (!resJson || !resJson.ok) {
            setBanner("warn", ${isProforma ? "Proforma" : "Venta"} ${finalDocId} guardada en local; revisa la conexión con Sheets.);
          } else {
            setBanner(
              "ok",
              ${isProforma ? "Proforma" : "Venta"} ${finalDocId} registrada en Google Sheets por ${formatMoney(t.total)} +
                (redeemedId ? ` (Canjeó ${redeemedId})` : "") +
                (!isProforma && method === "Efectivo" ? ` · Cambio: ${formatMoney(change)}` : "")
            );
          }
        } else {
          setBanner("warn", ${isProforma ? "Proforma" : "Venta"} ${finalDocId} generada en local.);
        }

        playBeep(true);
        if (isProforma) {
          showProformaQr(finalDocId, t.total);
        } else {
          document.getElementById("qrPanel").classList.remove("show");
        }

        clearTicket(true);
      } catch (err) {
        playBeep(true);
        if (isProforma) {
          showProformaQr(finalDocId, t.total);
        }
        setBanner("warn", ${isProforma ? "Proforma" : "Venta"} ${finalDocId} guardada localmente; sin respuesta de red al enviar.);
        clearTicket(true);
      } finally {
        state.isSubmitting = false;
        btnSubmit.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
    }

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        syncCatalog(true);
      }
    });

    window.addEventListener("DOMContentLoaded", function () {
      loadLocalCaches();
      renderTicket();
      syncCatalog(true);
    });
  </script>
</body>
</html>
