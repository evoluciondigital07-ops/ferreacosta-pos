<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERREAcosta POS</title>
  <style>
    :root {
      --bg: #0b1320;
      --card: #132033;
      --card-light: #1b2d47;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #263954;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, var(--bg) 0%, #070c14 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
    }

    header {
      background: #0f1a2b;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--accent);
    }

    .status-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-badge.ok {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .status-badge.warn {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .controls-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    select, input, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
    }

    select, input {
      background: var(--card);
      color: var(--text);
      padding: 8px 10px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      padding: 8px 12px;
      transition: transform 0.06s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-accent {
      background: var(--accent);
      color: #0b1320;
      border-color: var(--accent);
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    .btn-green {
      background: var(--green);
      color: #052e16;
      border-color: var(--green);
    }

    .btn-blue {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
    }

    .btn-ghost {
      background: var(--card-light);
      color: var(--text);
    }

    .btn-red {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    main {
      max-width: 1120px;
      margin: 16px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-btn {
      padding: 10px;
      background: var(--card-light);
      color: var(--muted);
    }

    .mode-btn.active-venta {
      background: var(--green);
      color: #0
<main>
    <section id="viewCaja">
      <div class="card">
        <div class="mode-switch">
          <button id="modeVentaBtn" class="mode-btn active-venta" type="button">MODO VENTA</button>
          <button id="modeProformaBtn" class="mode-btn" type="button">MODO PROFORMA</button>
        </div>

        <div class="scan-row">
          <input id="scanInput" type="text" placeholder="Escanea o escribe SKU / código / nombre..." autocomplete="off" />
          <button id="addScanBtn" class="btn-green" type="button">Agregar</button>
          <button id="simScanBtn" class="btn-accent" type="button">⚡ Simular Escaneo</button>
        </div>
        <div class="item-meta">Presiona Enter con lector de código o usa Simular Escaneo para probar sonido y ticket.</div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Búsqueda rápida de productos</span>
          <span id="catalogCountBadge">0 items</span>
        </div>
        <input id="searchInput" type="text" placeholder="Filtrar por nombre o código..." style="width: 100%;" />
        <div id="quickList" class="quick-list"></div>
      </div>
    </section>

    <section id="viewTicket">
      <div class="card">
        <div class="card-title">
          <span>TICKET ACTUAL (<span id="ticketModeLabel">VENTA</span>)</span>
          <button id="clearTicketBtn" class="btn-red" type="button">Limpiar</button>
        </div>

        <div id="ticketItems" class="ticket-items">
          <div class="item-meta">El ticket está vacío. Agrega o escanea un producto.</div>
        </div>

        <div class="totals-box">
          <div class="total-line">
            <span>Subtotal</span>
            <span id="subtotalVal">$0.00</span>
          </div>
          <div class="total-line">
            <span>IVA (15%)</span>
            <span id="ivaVal">$0.00</span>
          </div>
          <div class="total-final">
            <span>TOTAL</span>
            <span id="totalVal">$0.00</span>
          </div>
        </div>

        <div class="actions-grid">
          <button id="saveDocBtn" class="btn-green" type="button">Registrar en Sheets</button>
          <button id="copyTicketBtn" class="btn-blue" type="button">Copiar Resumen</button>
        </div>
      </div>
    </section>

    <section id="viewCatalogo" class="hidden" style="grid-column: 1 / -1;">
      <div class="card">
        <div class="card-title">
          <span>Catálogo sincronizado</span>
          <span id="catalogViewInfo">Modo local / Sheets</span>
        </div>
        <div id="fullCatalogList" class="quick-list" style="max-height: 460px;"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <nav>
    <button id="navCajaBtn" class="active" type="button">Caja y Ticket</button>
    <button id="navCatalogoBtn" type="button">Catálogo (<span id="navCatCount">0</span>)</button>
  </nav>

  <script>
    const CONFIG = {
      APPS_SCRIPT_URL: "",
      IVA_RATE: 0.15,
      STORAGE_SELLER_KEY: "ferreacosta_pos_vendedor_v1"
    };

    const CATALOGO_RESPALDO = [
      { sku: "FER-001", nombre: "Disco de corte metal 4-1/2\"", precio: 1.50, unidad: "und" },
      { sku: "FER-002", nombre: "Cable flexible #14 AWG negro", precio: 0.65, unidad: "m" },
      { sku: "FER-003", nombre: "Thinner diluyente galón", precio: 8.50, unidad: "gl" },
      { sku: "FER-004", nombre: "Brocha cerda azul 2\"", precio: 1.80, unidad: "und" },
      { sku: "FER-005", nombre: "Perno hexagonal 3/8 x 2\"", precio: 0.25, unidad: "und" },
      { sku: "FER-006", nombre: "Copa / broca para taladro 5/16\"", precio: 2.40, unidad: "und" }
    ];

    let state = {
      modo: "VENTA",
      catalogo: [...CATALOGO_RESPALDO],
      ticket: [],
      vendedor: "Caja Principal"
    };

    let audioCtx = null;
function reproducirBeepEscaneo(tipo = "ok") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = tipo === "ok" ? "sine" : "sawtooth";
        osc.frequency.setValueAtTime(tipo === "ok" ? 1046.5 : 320, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    function mostrarToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(mostrarToast._timer);
      mostrarToast._timer = setTimeout(() => el.classList.add("hidden"), 2200);
    }

    function initSeller() {
      const saved = localStorage.getItem(CONFIG.STORAGE_SELLER_KEY);
      const select = document.getElementById("sellerSelect");
      if (saved) {
        const exists = Array.from(select.options).some((o) => o.value === saved);
        if (!exists) {
          const opt = document.createElement("option");
          opt.value = saved;
          opt.textContent = saved;
          select.appendChild(opt);
        }
        select.value = saved;
        state.vendedor = saved;
      }
      select.addEventListener("change", () => {
        state.vendedor = select.value;
        localStorage.setItem(CONFIG.STORAGE_SELLER_KEY, state.vendedor);
        mostrarToast("Vendedor: " + state.vendedor);
      });
    }

    function setModo(nuevoModo) {
      state.modo = nuevoModo;
      document.getElementById("ticketModeLabel").textContent = nuevoModo;
      const ventaBtn = document.getElementById("modeVentaBtn");
      const profBtn = document.getElementById("modeProformaBtn");
      ventaBtn.className = "mode-btn" + (nuevoModo === "VENTA" ? " active-venta" : "");
      profBtn.className = "mode-btn" + (nuevoModo === "PROFORMA" ? " active-proforma" : "");
    }

    function renderCatalogos() {
      const term = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const filtered = state.catalogo.filter(
        (p) =>
          p.nombre.toLowerCase().includes(term) ||
          p.sku.toLowerCase().includes(term)
      );

      document.getElementById("catalogCountBadge").textContent = state.catalogo.length + " items";
      document.getElementById("navCatCount").textContent = state.catalogo.length;

      const quickList = document.getElementById("quickList");
      quickList.innerHTML = filtered
        .slice(0, 25)
        .map(
          (p) => `
          <div class="quick-item" onclick="agregarProductoPorSku('${p.sku.replace(/'/g, "\\'")}')">
            <div>
              <div class="item-name">${p.nombre}</div>
              <div class="item-meta">SKU: ${p.sku} · ${p.unidad || "und"}</div>
            </div>
            <div class="item-price">$${Number(p.precio || 0).toFixed(2)}</div>
          </div>`
        )
        .join("");

      const fullCatalogList = document.getElementById("fullCatalogList");
      fullCatalogList.innerHTML = state.catalogo
        .map(
          (p) => `
          <div class="quick-item">
            <div>
              <div class="item-name">${p.nombre}</div>
              <div class="item-meta">SKU: ${p.sku} · Unidad: ${p.unidad || "und"}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="item-price">$${Number(p.precio || 0).toFixed(2)}</span>
              <button class="btn-green" type="button" onclick="agregarProductoPorSku('${p.sku.replace(/'/g, "\\'")}')">+ Ticket</button>
            </div>
