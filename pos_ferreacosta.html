<!DOCTYPE html><html lang="es"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />  <title>FERREAcosta POS</title>  <style>    :root {      --bg: #0f172a;      --card: #1e293b;      --card-light: #334155;      --accent: #f59e0b;      --green: #10b981;      --red: #ef4444;      --blue: #3b82f6;      --text: #f8fafc;      --muted: #94a3b8;    }    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 85px; }    header {      background: #020617;      padding: 12px 14px;      display: flex;      justify-content: space-between;      align-items: center;      border-bottom: 1px solid #334155;      position: sticky;      top: 0;      z-index: 10;    }    .brand { font-weight: 800; font-size: 16px; color: var(--accent); }    .status-badge {      font-size: 11px;      padding: 4px 8px;      border-radius: 999px;      background: var(--card);      color: var(--muted);    }    .status-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }    .status-err { background: rgba(239, 68, 68, 0.2); color: #f87171; }    select, input, button {      border-radius: 10px;      border: 1px solid #475569;      padding: 10px 12px;      font-size: 15px;    }    select, input { background: #0f172a; color: var(--text); width: 100%; }    button { cursor: pointer; font-weight: 700; border: none; }    .container { padding: 12px; max-width: 600px; margin: 0 auto; }    .card {      background: var(--card);      border-radius: 14px;      padding: 14px;      margin-bottom: 12px;    }    .row { display: flex; gap: 8px; align-items: center; }    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }    .mode-btn { background: var(--card-light); color: var(--muted); padding: 10px; }    .mode-btn.active-venta { background: var(--green); color: #022c22; }    .mode-btn.active-proforma { background: var(--accent); color: #451a03; }    .btn-primary { background: var(--blue); color: white; }    .btn-accent { background: var(--accent); color: #1e1b18; }    .btn-green { background: var(--green); color: #022c22; width: 100%; padding: 14px; font-size: 16px; }    .btn-danger { background: var(--red); color: white; padding: 6px 10px; font-size: 12px; }    .ticket-item {      display: flex;      justify-content: space-between;      align-items: center;      padding: 10px 0;      border-bottom: 1px solid #334155;      gap: 8px;    }    .ticket-item:last-child { border-bottom: none; }    .qty-controls { display: flex; align-items: center; gap: 6px; }    .qty-btn { background: var(--card-light); color: white; width: 32px; height: 32px; padding: 0; }    .total-box {      display: flex;      justify-content: space-between;      font-size: 20px;      font-weight: 800;      margin: 12px 0;      color: #34d399;    }    nav {      position: fixed;      bottom: 0;      left: 0;      right: 0;      background: #020617;      border-top: 1px solid #334155;      display: grid;      grid-template-columns: 1fr 1fr;      padding: 8px;      gap: 8px;    }    nav button { background: transparent; color: var(--muted); padding: 10px; }    nav button.active { background: var(--card); color: var(--accent); }    .hidden { display: none; }    .quick-list { max-height: 180px; overflow-y: auto; margin-top: 8px; }    .quick-item {      display: flex;      justify-content: space-between;      padding: 8px;      background: #0f172a;      border-radius: 8px;      margin-bottom: 6px;      cursor: pointer;    }  </style></head><body>  <header>    <div>      <div class="brand">FERRE
